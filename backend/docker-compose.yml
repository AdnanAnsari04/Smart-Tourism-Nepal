# Local development convenience only — spins up a throwaway SQL Server
# instance. Do not use this compose file, or the password in it, in
# production. Production should point SQL_CONNECTION_STRING at a managed
# SQL Server instance with real, secret credentials.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smarttourism-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Local_Only_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - smarttourism_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  smarttourism_sqldata:
